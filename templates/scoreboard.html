<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Daybreak · College Application Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Cormorant+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
  :root{
    /* Type scale — 4 sizes only (stage coords) */
    --t1:20px;   /* labels, meta */
    --t2:24px;   /* body values */
    --t3:32px;   /* card titles */
    --t4:48px;   /* detail / page titles */
    --lab-w:200px;
    --pad:16px;
    --gap:8px;
    --ink:#E8E4DC; --muted:#9A958C; --dim:rgba(232,228,220,.55);
    --hair:rgba(255,255,255,.08); --rule:rgba(255,255,255,.12);
    --gold:#C9A86A; --up:#8FBF9A; --panel:rgba(255,255,255,.03);
    /* TV remote focus — warm Daybreak gold (not neon), readable across the room. */
    --focus-ring:#E6B84C;
    --admit-bar:#3DCF7A;
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0B0C0E}
  body{font-family:Inter,"SF Pro Text",system-ui,sans-serif;color:var(--ink);
    font-feature-settings:"tnum" 1,"lnum" 1;-webkit-font-smoothing:antialiased}
  #stage{position:absolute;left:50%;top:50%;width:3840px;height:2160px;transform-origin:center center;
    display:flex;flex-direction:column;gap:16px;padding:32px 64px 24px;overflow:hidden;
    background:linear-gradient(180deg,#12141A 0%,#0B0C0E 100%)}
  #stage[hidden],[hidden]{display:none!important}

  /* —— Shared primitives —— */
  .eyebrow{font-size:var(--t1);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .sec-h{display:flex;align-items:center;gap:10px;margin:0 0 8px;min-width:0;
    padding-bottom:4px;border-bottom:2px solid var(--accent,var(--gold))}
  .sec-h::before{content:"";flex:none;width:24px;height:3px;border-radius:2px;background:var(--accent,var(--gold));opacity:1}
  .sec-h span{font-size:22px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent,var(--gold));white-space:nowrap}
  .sec-h em{font-style:normal;color:var(--accent,var(--gold));margin-left:8px;letter-spacing:.08em;font-weight:600;opacity:.85}
  .lab{font-size:var(--t1);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
    line-height:1.25;text-align:right;padding-top:2px;
    white-space:normal;overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:none;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;max-height:calc(2 * 1.25em);text-overflow:clip}
  .txt{font-size:var(--t2);line-height:1.35;font-weight:400;color:var(--ink);overflow-wrap:break-word;word-break:normal;
    white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;max-height:calc(3 * 1.35em)}
  .txt .src{font-size:var(--t1);color:var(--muted);font-weight:400}
  .line.good .txt{color:var(--up)}.line.warn .txt{color:#C4A07A}.line.muted .txt{color:var(--muted)}
  .line{display:grid;grid-template-columns:var(--lab-w) minmax(0,1fr);gap:12px;align-items:start;min-width:0}
  .line.nolab{grid-template-columns:minmax(0,1fr)}
  .lines,.d-lines{display:flex;flex-direction:column;gap:8px;min-width:0}

  /* Logos — dark plate by default; light plates use warm linen (not bright cream).
     Plate boxes hug the rendered logo aspect (wide wordmarks stay short; square marks stay ~100px tall). */
  .logo{flex:none;position:relative;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;
    border-radius:10px;background:#1E2128;border:1px solid var(--hair);box-sizing:border-box}
  .logo.on-light{background:#E8E6E0;border:1px solid rgba(255,255,255,.08);border-radius:10px}
  .logo.on-dark{background:#1E2128;border:1px solid var(--hair)}
  .logo-sm{width:84px;height:28px;border-radius:8px;padding:3px 6px;display:flex}
  /* Detail + popup plates hug the image; JS fitLogoImg sets explicit px from naturalWidth/Height
     so viewBox-only SVGs (0×0 with width/height:auto) and small-pixel marks both scale into 680×200 stage. */
  .logo-lg,.logo-pop{width:auto;max-width:720px;height:auto;min-height:0;border-radius:10px;padding:10px 14px;
    align-self:flex-start;flex:none}
  .logo img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
  .logo-lg img,.logo-pop img{display:block;width:auto;height:auto;max-width:none;max-height:none;
    object-fit:contain;object-position:center}
  .logo .mono{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink);line-height:1}
  .logo-lg .mono,.logo-pop .mono{font-size:56px;letter-spacing:.08em;line-height:1;padding:8px 4px}
  .logo.on-light .mono{color:#1A1C20}
  .logo:not(.mono-only) .mono{display:none}
  .logo.mono-only .mono{display:block}
  .logo.mono-only img{display:none!important}

  /* Header */
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex:none;padding-bottom:8px;border-bottom:1px solid var(--hair)}
  .head h1{margin:4px 0 0;font:300 var(--t4)/1.05 Inter,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.03em}
  .head-l{display:flex;align-items:flex-end;gap:24px;min-width:0}
  .head-r{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
  .updated{font-size:var(--t2);font-weight:400;color:var(--muted);white-space:nowrap}
  .updated b{font-weight:500;font-size:var(--t1);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-right:10px}
  .counts{display:flex;gap:8px}
  .count{display:flex;align-items:baseline;gap:10px;padding:8px 16px;border:1px solid var(--hair);border-radius:8px;background:var(--panel)}
  .count .n{font:300 40px/1 Inter,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.02em}
  .count .l{font-size:var(--t1);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .count.admitted .l{color:var(--up)}.count.pending .l{color:var(--gold)}.count.denied .l{color:var(--muted)}

  /* Board columns */
  .cols{flex:1;min-height:0;display:grid;gap:16px;overflow:visible}
  .col{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
  .col-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 0;
    border-bottom:2px solid rgba(var(--t),.55)}
  .col-head .t{font-size:var(--t1);font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgb(var(--t))}
  .col-head .c{font-size:var(--t1);font-weight:500;letter-spacing:.1em;color:var(--dim)}
  /* Couch-readable density: fill most of 1920×1080; layoutBoard shrinks if Safety would overflow */
  .col-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:visible;padding:12px 10px;box-sizing:border-box}
  .col-cue{flex:none;height:18px;display:flex;align-items:center;justify-content:center;visibility:hidden;font-size:16px;color:var(--dim)}

  .card{flex:none;position:relative;display:flex;flex-direction:column;gap:6px;padding:10px 14px 10px 18px;border-radius:8px;
    border:1px solid var(--hair);background:var(--panel);cursor:pointer;outline:none;z-index:0;
    transform:scale(1);transform-origin:center center;
    transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease,filter .15s ease,border-color .15s ease}
  .card::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--c)}
  /* Admitted tiles: crisp green left bar so accepts pop at a glance from the couch */
  .card.admitted::before{background:var(--admit-bar);width:4px;top:6px;bottom:6px}
  .card.denied,.card.withdrawn{opacity:.78}
  /* Warm Daybreak gold ring + subtle lift — neighbors stay fully readable (no dimming) */
  .card.focus{border-color:var(--focus-ring);opacity:1;filter:none;z-index:6;
    transform:scale(1.02) translateY(-4px);
    box-shadow:0 0 0 12px var(--focus-ring),0 0 28px 8px rgba(230,184,76,.35),0 12px 22px rgba(0,0,0,.4)}
  .name-row{flex:none;display:flex;align-items:center;gap:10px;min-width:0}
  .name{flex:1;min-width:0;font:400 30px/1.12 Inter,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .name .prog{color:var(--muted);font-weight:400}
  .rank-pill{flex:none;font-size:var(--t1);font-weight:500;letter-spacing:.08em;color:var(--muted);
    padding:4px 10px;border-radius:6px;border:1px solid var(--hair);background:rgba(255,255,255,.03);white-space:nowrap}
  .tags{flex:none;display:flex;flex-wrap:wrap;gap:8px}
  .tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:6px;white-space:nowrap;
    font-size:var(--t1);font-weight:500;letter-spacing:.1em;text-transform:uppercase;
    color:var(--c);border:1px solid var(--cb);background:var(--cf)}
  .tag.plain{--c:var(--muted);--cb:var(--hair);--cf:transparent}
  .tag.date{--c:var(--gold);--cb:rgba(201,168,106,.3);--cf:rgba(201,168,106,.06)}
  /* New Marist classmate flag on board tiles — bright gold, readable across the room */
  .tag.new-marist{--c:#1A1508;--cb:rgba(255,210,74,.95);--cf:#FFD24A;font-weight:700;letter-spacing:.14em}
  .tag.new-marist-who{--c:#FFD24A;--cb:rgba(255,210,74,.4);--cf:rgba(255,210,74,.1);
    max-width:46%;overflow:hidden;text-overflow:ellipsis}
  #cols{--line-size:22px;--lab-size:18px}
  #cols .lab{font-size:var(--lab-size);-webkit-line-clamp:1;max-height:1.25em;line-height:1.25}
  /* One couch-readable line per row keeps 5 Safety tiles on-screen at the larger type size */
  #cols .txt{font-size:var(--line-size);-webkit-line-clamp:1;max-height:1.35em;line-height:1.35}
  #cols .lines{gap:5px}
  #cols .line{gap:8px}
  #cols .tags{gap:6px}
  #cols .tag{padding:3px 9px;font-size:18px}
  #cols .rank-pill{font-size:18px;padding:3px 9px}
  #cols .logo-sm{width:78px;height:26px;padding:2px 6px}
  /* NEXT line: full unclipped text (no max-height/line-clamp — those ate padding under border-box) */
  .step{flex:none;margin-top:4px;padding:8px 0 0;border-top:1px solid var(--hair);font-size:20px;line-height:1.3;font-weight:400;color:var(--muted);
    display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .step b{font-weight:500;color:var(--dim);font-size:16px;letter-spacing:.12em;text-transform:uppercase;margin-right:8px}

  .also{flex:none;display:flex;align-items:baseline;gap:16px;padding:8px 0;border-top:1px solid var(--hair);min-width:0}
  .also[hidden]{display:none!important}
  .also .k{flex:none;font-size:var(--t1);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
  .also .items{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px 24px;font-size:var(--t2);font-weight:400;color:var(--muted);
    max-height:calc(2 * 1.35em);overflow:hidden}
  .also .items b{font-weight:500;color:var(--ink);margin-right:6px}

  .foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:8px;border-top:1px solid var(--hair)}
  .hints{display:flex;align-items:center;font-size:var(--t1);color:var(--dim);letter-spacing:.06em;text-transform:uppercase;font-weight:400}
  .hints span+span::before{content:"\00b7";margin:0 14px;color:var(--hair)}
  .hints b{font-weight:500;color:var(--muted);margin-right:8px}

  .roi-chip{appearance:none;-webkit-appearance:none;margin:0 0 4px;padding:8px 16px;border-radius:6px;cursor:pointer;outline:none;
    border:1px solid rgba(201,168,106,.35);background:rgba(201,168,106,.08);color:var(--ink);
    font:500 var(--t1)/1 Inter,"SF Pro Display",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}
  .roi-chip[hidden]{display:none!important}
  .roi-chip.focus{box-shadow:0 0 0 2px rgba(201,168,106,.9)}

  /* Detail */
  #detail{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;--line-size:24px;--lab-size:20px;--lab-w:200px;position:relative;overflow:visible}
  /* Hero: logo (aspect-hugging plate) | name+program+rank+chips | inline Aug–May weather table.
     align-items:flex-start so the logo plate is never stretched tall by the weather column. */
  .d-hero{flex:none;display:flex;align-items:flex-start;gap:16px;min-width:0;padding-bottom:10px;border-bottom:1px solid var(--hair);
    min-height:0}
  /* ~420px min on the 1920 viewport (stage is 2×). Weather flexes to fill the rest. */
  .d-hero-main{flex:0 1 auto;min-width:840px;max-width:48%;display:flex;flex-direction:column;justify-content:center;gap:10px;
    border-left:4px solid var(--accent,var(--gold));padding-left:14px;align-self:stretch}
  .d-hero-title{min-width:0}
  /* School ~44px viewport; wrap allowed, never clipped. Underline under the school name only. */
  .d-hero h2{margin:0;font:300 88px/1.12 Inter,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.025em;min-width:0;
    white-space:normal;overflow:visible;overflow-wrap:break-word;word-break:normal;
    border-bottom:2px solid var(--accent,var(--gold));padding-bottom:6px}
  /* Program on its own line ~28px viewport, muted — clear of underline and chips. */
  .d-hero-prog{margin:8px 0 0;font:400 56px/1.2 Inter,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.01em;
    color:var(--muted);white-space:normal;overflow:visible;overflow-wrap:break-word}
  .d-hero .rank-pill{flex:none;align-self:flex-start;margin-top:2px}
  .d-hero .tags{gap:6px;margin-top:2px}
  .d-hero .tag{font-size:var(--t1);padding:4px 10px}

  /* Inline monthly weather — fills remaining hero width; columns shrink slightly vs name block. */
  .wx-month-band{flex:1 1 0;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;
    padding:6px 10px;border:1px solid var(--hair);border-radius:8px;background:var(--panel);box-sizing:border-box}
  .wx-month-table{width:100%;border-collapse:collapse;table-layout:fixed}
  .wx-month-table th,.wx-month-table td{padding:2px 2px;text-align:center;vertical-align:middle;
    font-feature-settings:"tnum" 1,"lnum" 1}
  .wx-month-table thead th{font-size:36px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);
    border-bottom:1px solid var(--hair);padding-bottom:4px}
  .wx-month-table thead th .wx-season{display:inline-flex;flex-direction:row;align-items:center;justify-content:center;gap:3px}
  .wx-month-table thead th .wx-season svg{width:20px;height:20px;color:var(--accent,var(--gold));flex:none}
  .wx-month-table tbody th{text-align:left;font-size:26px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--dim);padding-left:2px;white-space:nowrap}
  .wx-month-table tbody td{font:700 46px/1.05 Inter,"SF Pro Display",system-ui,sans-serif;color:var(--ink)}
  .wx-month-table tbody tr.wx-hi td{color:#E0A070}
  .wx-month-table tbody tr.wx-lo td{color:#7EB6E0}
  .wx-month-table tbody tr+tr th,.wx-month-table tbody tr+tr td{border-top:1px solid rgba(255,255,255,.04)}
  .wx-month-cap{margin:4px 0 0;font-size:16px;font-weight:400;color:var(--dim);letter-spacing:.03em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wx-normals-fallback{display:flex;flex-direction:column;gap:4px;padding:2px 0 0}
  .wx-normals-fallback .line{grid-template-columns:64px minmax(0,1fr);gap:8px}
  .wx-normals-fallback .lab{font-size:20px}
  .wx-normals-fallback .txt{font-size:24px;-webkit-line-clamp:1;max-height:1.2em}
  .card .line.wx-line .lab{color:var(--gold)}
  .marist-body{display:flex;flex-direction:column;gap:8px;min-width:0}
  .marist-year{font-size:var(--line-size,var(--t2));font-weight:600;color:var(--ink);letter-spacing:.02em}
  .marist-year b{font-weight:700;color:var(--accent,var(--gold));margin-right:8px}
  .marist-names{display:grid;grid-template-columns:1fr;gap:4px 16px;margin:4px 0 0;font-size:var(--line-size,var(--t2));
    font-weight:400;color:var(--ink);line-height:1.3}
  .marist-names.cols-2{grid-template-columns:1fr 1fr}
  .marist-names .more{color:var(--muted);font-weight:500}
  .marist-majors{margin:2px 0 0;font-size:var(--line-size,var(--t2));font-weight:400;color:var(--ink);line-height:1.35;
    overflow-wrap:break-word}
  .marist-empty{margin:0;font-size:var(--line-size,var(--t2));font-weight:400;color:var(--muted)}
  .marist-note{margin:4px 0 0;font-size:var(--t1);font-weight:400;color:var(--dim);line-height:1.3}
  .marist-totals{margin:0 0 6px;font-size:var(--line-size,var(--t2));font-weight:500;color:var(--ink);
    letter-spacing:.02em;line-height:1.35;overflow-wrap:break-word}
  .marist-totals b{font-weight:700;color:var(--accent,var(--gold));margin-right:4px}
  .marist-tot-sep{color:var(--dim);font-weight:400}
  /* Creative-school card/popup: single full-width column (no label/value grid) */
  .ncs-body{display:flex;flex-direction:column;gap:10px;min-width:0;width:100%}
  .ncs-body .prose{margin:0}
  .ncs-body .why-bullets{margin:0}
  .ncs-subhead{margin:4px 0 0;font-size:var(--t1);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent,var(--gold));line-height:1.2}
  .ncs-para{margin:0;font-size:var(--line-size,var(--t2));line-height:1.35;font-weight:400;color:var(--ink);
    overflow-wrap:break-word}
  .ncs-sources{display:flex;flex-direction:column;gap:6px;min-width:0;width:100%}
  .ncs-source{margin:0;font-size:var(--line-size,var(--t2));line-height:1.35;font-weight:400;color:var(--ink);
    overflow-wrap:break-word;word-break:normal}
  .ncs-source b{font-weight:700;color:var(--ink)}
  .wish-src{margin:6px 0 0;font-size:var(--t1);font-weight:400;color:var(--dim);line-height:1.35;
    overflow-wrap:break-word}
  /* Detail-page lead accents stay muted; popup overrides via #d-pop rule below */

  /* Padding + visible overflow so focused card scale/ring/glow are not clipped by columns */
  .d-body{flex:1;min-height:0;column-count:4;column-gap:12px;overflow:visible;padding:20px 16px;box-sizing:border-box}
  /* Extra bottom margin so top-origin scale(1.04) + 20px ring never covers the next card's text */
  .d-sec{display:inline-block;width:100%;vertical-align:top;box-sizing:border-box;margin:0 0 40px;
    break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;
    padding:8px 10px;border:1px solid var(--hair);border-radius:8px;background:var(--panel)}
  .d-sec.next{border-color:rgba(201,168,106,.35)}
  .d-card{cursor:pointer;outline:none;position:relative;z-index:0;
    transform:scale(1);transform-origin:top center;
    transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease,filter .15s ease,border-color .15s ease}
  .d-card.d-card-focus,.d-card:focus{border-color:var(--focus-ring);z-index:6;opacity:1;filter:none;
    transform:scale(1.04);
    box-shadow:0 0 0 20px var(--focus-ring),0 0 64px 22px rgba(255,210,74,.6),0 22px 44px rgba(0,0,0,.55)}
  #detail.cards-focused .d-card:not(.d-card-focus){opacity:.7;filter:brightness(.75)}
  .why-pair .why-col.d-card{padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent;
    transform-origin:top center}
  .why-pair .why-col.d-card.d-card-focus,.why-pair .why-col.d-card:focus{
    border-color:var(--focus-ring);background:rgba(255,255,255,.04);z-index:6;opacity:1;filter:none;
    transform:scale(1.04);
    box-shadow:0 0 0 20px var(--focus-ring),0 0 64px 22px rgba(255,210,74,.6),0 22px 44px rgba(0,0,0,.55)}
  .why-pair{margin-bottom:40px}

  /* Detail card popup — ~90% overlay, ~2× body type */
  #d-pop{position:absolute;left:0;top:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;justify-content:center;
    --pop-line:48px;--pop-lab:36px;--pop-title:80px;--pop-ink:#F5F1E8}
  #d-pop[hidden]{display:none!important}
  .d-pop-backdrop{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.78)}
  .d-pop-panel{position:relative;z-index:1;width:90%;height:90%;box-sizing:border-box;display:flex;flex-direction:column;
    gap:20px;padding:36px 44px 32px;border:1px solid var(--hair);border-radius:14px;
    background:linear-gradient(180deg,#16181F 0%,#0E1014 100%);box-shadow:0 24px 80px rgba(0,0,0,.55);min-height:0;overflow:hidden;
    border-top:3px solid var(--accent,var(--focus-ring));color:var(--pop-ink)}
  /* Title: school accent (fallback bright gold), bold, clearly larger than body + thin accent rule.
     Optional logo sits top-right; title/rule/body never overlap it (reserved flex + gap). */

  /* Academics CDS / source parentheticals: ~60% of body, off-white at ~75% opacity (not tiny grey) */

  .d-pop-body .prose{font-size:var(--pop-line);line-height:1.4;-webkit-line-clamp:unset;max-height:none;overflow:visible;display:block;color:var(--pop-ink)}
  .d-pop-body .why-bullets{gap:12px}

  .d-pop-body .why-bullets li::before{width:8px;height:8px;top:.6em;background:var(--accent,var(--focus-ring))}
  /* One high-specificity rule: every popup label / lead / bold lead-in uses contrast-safe --accent */
  #d-pop .lab,#d-pop .lbl,#d-pop .pop-lead,#d-pop .ncs-subhead,

    text-align:center;padding-top:8px}
  .d-pop-edge{position:absolute;top:5%;bottom:5%;z-index:2;width:7%;min-width:72px;max-width:140px;

    background:transparent;color:rgba(232,228,220,.35);font-size:64px;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:color .12s ease,background .12s ease}
  .d-pop-edge:hover,.d-pop-edge:focus{outline:none;color:var(--accent,var(--focus-ring));background:rgba(255,255,255,.04)}
  .d-pop-edge-l{left:0;border-radius:0 12px 12px 0}

  #detail .lab{font-size:var(--lab-size);letter-spacing:.06em;overflow-wrap:break-word;word-break:break-word;
    white-space:normal;-webkit-line-clamp:3;max-height:calc(3 * 1.25em);hyphens:auto}
  #detail .txt{font-size:var(--line-size);min-width:0}

  #detail .d-lines{gap:4px}
  /* Label column wraps long names (SAT mid-50, Marist near me); keep a clear gap before values. */

  .d-sec .prose{margin:0;font-size:var(--line-size,var(--t2));line-height:1.3;font-weight:400;color:var(--ink);
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden;max-height:calc(5 * 1.3em)}

  .why-bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}

    overflow-wrap:break-word;word-break:normal;display:block;-webkit-line-clamp:unset;max-height:none;overflow:visible}
  .why-bullets li::before{content:"";position:absolute;left:0;top:.55em;width:5px;height:5px;border-radius:50%;background:var(--gold)}

  .tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .tl li{position:relative;display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:0 0 0 16px;font-size:var(--line-size,var(--t2));line-height:1.3}
  .tl li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .tl li::after{content:"";position:absolute;left:2px;top:18px;bottom:-10px;width:1px;background:var(--rule)}
  .tl li:last-child::after{display:none}
  .tl .d{font-size:var(--t1);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding-top:2px;text-align:right}
  .tl .e{font-weight:400;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;max-height:calc(2 * 1.35em)}

  /* ROI Ladder (same type scale) */
  #roi{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
  .roi-head h2{margin:4px 0 0;font:300 var(--t4)/1.05 Inter,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.03em}
  .roi-sub{margin-top:8px;font-size:var(--t2);font-weight:400;color:var(--muted);max-width:2800px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .roi-table{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:8px;background:var(--panel);overflow:hidden}
  .roi-cols{flex:none;display:grid;grid-template-columns:560px minmax(0,1.45fr) minmax(0,.95fr) 300px minmax(0,1fr);
    gap:16px;padding:12px 24px;border-bottom:1px solid var(--hair)}
  .roi-cols span{font-size:var(--t1);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .roi-cols span:nth-child(4),.roi-cols span:nth-child(5){text-align:right}
  .roi-rows{flex:1;min-height:0;display:flex;flex-direction:column}
  .roi-row{flex:1;min-height:0;display:grid;grid-template-columns:560px minmax(0,1.45fr) minmax(0,.95fr) 300px minmax(0,1fr);
    gap:16px;align-items:center;padding:0 24px;border-top:1px solid rgba(255,255,255,.04)}
  .roi-row:first-child{border-top:0}
  .roi-school{display:flex;align-items:center;gap:12px;min-width:0}
  .roi-dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--tc)}
  .roi-school .n{font:400 var(--t3)/1.15 Inter,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.015em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .roi-metric{display:flex;align-items:center;gap:12px;min-width:0}
  .roi-track{position:relative;flex:1;min-width:0;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
  .roi-track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--fill,rgba(201,168,106,.75))}
  .roi-track.est .fill{background:repeating-linear-gradient(135deg,rgba(201,168,106,.38) 0 8px,rgba(201,168,106,.14) 8px 16px);
    border:1px dashed rgba(240,237,230,.3);border-left:0;box-sizing:border-box}
  .roi-track .ceil{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed rgba(226,154,145,.9);z-index:2}

  .roi-earn{justify-content:flex-end;font:400 var(--t2)/1 Inter,"SF Pro Display",system-ui,sans-serif;white-space:nowrap}
  .roi-earn i{font-style:normal;color:var(--gold);margin-left:4px;font-size:var(--t1)}
  .roi-metric.roi-out .fill{background:rgba(143,191,154,.78)}
  .roi-metric.roi-out .roi-val{font-weight:600;color:#E8F0E6}
  .roi-leg{flex:none;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  .roi-leg .item{display:flex;align-items:center;gap:8px;font-size:var(--t1);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .roi-leg .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
  .roi-leg .ceil-mark{width:20px;height:0;border-top:2px dashed rgba(226,154,145,.9)}
  .roi-leg .dash-mark{width:28px;height:8px;border-radius:2px;border:1px dashed rgba(240,237,230,.35);
    background:repeating-linear-gradient(135deg,rgba(201,168,106,.35) 0 6px,rgba(201,168,106,.12) 6px 12px)}
  .roi-notes{flex:none;font-size:var(--t1);line-height:1.35;font-weight:400;color:var(--muted);
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-height:calc(2 * 1.35em)}
</style>

<body>
<div id="stage" hidden>
  <div class="head">
    <div class="head-l">
      <div><div class="eyebrow">Daybreak / 02</div><h1 id="title">College Application Board</h1></div>
      <button type="button" class="roi-chip" id="roi-chip" hidden>ROI</button>
    </div>
    <div class="head-r"><div class="counts" id="counts"></div><div class="updated"><b>Updated</b><span id="updated"></span></div></div>
  </div>
  <div class="cols" id="cols"></div>
  <div id="detail" hidden></div>
  <div id="d-pop" hidden>
    <div class="d-pop-backdrop" aria-hidden="true"></div>
    <button type="button" class="d-pop-edge d-pop-edge-l" data-pop-nav="left" aria-label="Previous card">&#9664;</button>
    <button type="button" class="d-pop-edge d-pop-edge-r" data-pop-nav="right" aria-label="Next card">&#9654;</button>
    <div class="d-pop-panel" role="dialog" aria-modal="true">
      <div class="d-pop-h"><span id="d-pop-title"></span></div>
      <div class="d-pop-body" id="d-pop-body"></div>
      <div class="d-pop-hint">&#9664; &#9654; Cards &middot; &#9650;&#9660; Scroll &middot; OK / Back Close</div>
    </div>
  </div>
  <div id="roi" hidden></div>
  <div class="also" id="also" hidden></div>
  <div class="foot"><div class="hints" id="hints"></div><div id="foot-r"></div></div>
</div>
<script>
(function(){
  'use strict';
  var TZ='America/New_York';
  var DEFAULT_FILE='coco-admissions.json';
  var DEFAULT_BACK='https://gildernew-max.github.io/frame-bfb9d71787/';
  var REFRESH_MS=5*60*1000;
  var ROUNDS={ED:1,ED2:1,EA:1,REA:1,RD:1,Rolling:1};
  var STATUS={
    not_submitted:{label:'Not yet submitted',c:'#CFCAC1',group:0},
    submitted:{label:'Submitted',c:'#6FA8DC',group:0},
    in_review:{label:'In review',c:'#C9A86A',group:0},
    deferred:{label:'Deferred',c:'#B9A3D6',group:0},
    waitlisted:{label:'Waitlisted',c:'#7FBFB8',group:0},
    unconfirmed:{label:'Not confirmed',c:'#9A968F',group:0},
    admitted:{label:'Accepted',c:'#99C7A6',group:1},
    denied:{label:'Denied',c:'#A9A49C',group:2},
    withdrawn:{label:'Withdrawn',c:'#8A867F',group:3}
  };
  var TIERS=[
    {key:'reach',label:'Reach',rgb:'217,140,128'},
    {key:'target',label:'Target',rgb:'201,168,106'},
    {key:'safety',label:'Safety',rgb:'153,199,166'},
    {key:'unsorted',label:'Unsorted',rgb:'173,168,160'}
  ];
  var DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
  // cols/focus for school cards; chipFocus for ROI chip; view 'board'|'detail'|'roi'.
  // cardFocus: index into detail .d-card nodes; popupOpen: detail section overlay.
  var state={cols:[],focus:null,detail:null,detailPage:1,detailPages:1,data:null,roi:null,chipFocus:false,view:'board',
    cardFocus:0,popupOpen:false};

  function $(id){return document.getElementById(id);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function str(v){return typeof v==='string'&&v.trim()?v.trim():'';}
  // Only known keys are read; extra query params (e.g. cache-buster v=) are ignored.
  function param(name){
    var m=new RegExp('[?&]'+name+'=([^&#]*)').exec(location.search);
    if(!m)return '';
    try{return decodeURIComponent(m[1].replace(/\+/g,' '));}catch(_){return '';}
  }
  function dataFile(){
    var f=param('f');
    return /^[A-Za-z0-9._-]+\.json$/.test(f)&&f.indexOf('..')<0?f:DEFAULT_FILE;
  }
  function backUrl(){
    var b=param('back');
    return /^https?:\/\//i.test(b)?b:DEFAULT_BACK;
  }
  function fit(){
    var w=window.innerWidth||document.documentElement.clientWidth, h=window.innerHeight||document.documentElement.clientHeight;
    var s=Math.min(w/3840,h/2160);
    if(!(s>0)){setTimeout(fit,500);return;}
    $('stage').style.transform='translate(-50%,-50%) scale('+s+')';
    if(state.view==='detail')layoutDetail();
    else if(state.view==='board')layoutBoard();
  }

  // Calendar dates (YYYY-MM-DD) are compared as UTC midnights so no time zone can shift the day.
  function dayNum(ymd){var p=ymd.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5;}
  function todayEt(){
    var p=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()), o={};
    for(var i=0;i<p.length;i++)o[p[i].type]=p[i].value;
    return o.year+'-'+o.month+'-'+o.day;
  }
  function fmtDate(ymd,withYear){
    var p=ymd.split('-'), d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2],12));
    var o={timeZone:'UTC',month:'short',day:'numeric'};
    if(withYear)o.year='numeric';
    return new Intl.DateTimeFormat('en-US',o).format(d);
  }
  function fmtUpdated(iso){
    var d=new Date(iso);
    if(typeof iso!=='string'||isNaN(+d))return '';
    var day=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric'}).format(d);
    var t=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'}).format(d);
    return day+' \u00b7 '+t+' ET';
  }
  function daysUntil(ymd){return dayNum(ymd)-dayNum(todayEt());}
  function daysText(n){return n===0?'today':n===1?'1 day':n+' days';}
  function hexA(hex,a){
    var m=/^#(..)(..)(..)$/.exec(hex);
    return m?'rgba('+parseInt(m[1],16)+','+parseInt(m[2],16)+','+parseInt(m[3],16)+','+a+')':hex;
  }
  function tagVars(hex){return '--c:'+hex+';--cb:'+hexA(hex,.42)+';--cf:'+hexA(hex,.10);}

  function cleanLabeled(raw,max){
    if(!Array.isArray(raw))return [];
    var out=[], i, lim=max||14;
    for(i=0;i<raw.length&&out.length<lim;i++){
      var x=raw[i];
      if(!x||typeof x!=='object'||!str(x.text))continue;
      var tone=x.tone==='good'||x.tone==='warn'||x.tone==='muted'?x.tone:'';
      out.push({label:str(x.label), text:str(x.text), tone:tone});
    }
    return out;
  }
  // Shape: {label?, text, sources?} — also accept plain strings. Sources never rendered on TV.
  function cleanStudentNotes(raw){
    if(!Array.isArray(raw))return [];
    var out=[], i, t, lab, x, srcs, j, u;
    for(i=0;i<raw.length&&out.length<8;i++){
      x=raw[i];
      if(typeof x==='string'){
        t=str(x);
        if(!t)continue;
        if(t.length>160)t=t.slice(0,160);
        out.push({label:'', text:t, sources:[]});
        continue;
      }
      if(!x||typeof x!=='object')continue;
      t=str(x.text);
      if(!t)continue;
      if(t.length>160)t=t.slice(0,160);
      lab=str(x.label);
      srcs=[];
      if(Array.isArray(x.sources)){
        for(j=0;j<x.sources.length&&srcs.length<8;j++){
          u=str(x.sources[j]);
          if(u)srcs.push(u);
        }
      }
      out.push({label:lab, text:t, sources:srcs});
    }
    return out;
  }
  function detailHasContent(d){
    if(!d)return false;
    if(d.history&&d.history.length)return true;
    if(d.weather_monthly&&d.weather_monthly.months&&d.weather_monthly.months.length)return true;
    if(d.marist_classmates)return true;
    if(d.new_creative_school)return true;
    if(d.wish_i_knew)return true;
    if(d.odds||d.sticker_price_per_year||d.counselor_take||d.why||d.why_not||d.scattergram_url)return true;
    var keys=['about','costs','deadlines','academics','alumni','facts','internships','housing','weather','why_points','why_not_points','student_likes','student_dislikes'], i;
    for(i=0;i<keys.length;i++)if(d[keys[i]]&&d[keys[i]].length)return true;
    return false;
  }
  // Optional school announcement card. URLs are kept for data fidelity but never rendered (TV).
  // facts: {label, text} (plain strings still accepted).
  function cleanNewCreativeSchool(raw){
    if(!raw||typeof raw!=='object')return null;
    var name=str(raw.name), summary=str(raw.summary), why=str(raw.why_it_matters_for_coco);
    var facts=[], articles=[], i, t, a, title, outlet, date, url, lab, fx;
    if(Array.isArray(raw.facts)){
      for(i=0;i<raw.facts.length&&facts.length<12;i++){
        fx=raw.facts[i];
        if(typeof fx==='string'){
          t=str(fx);
          if(t)facts.push({label:'', text:t});
          continue;
        }
        if(!fx||typeof fx!=='object')continue;
        t=str(fx.text); lab=str(fx.label);
        if(!t&&!lab)continue;
        if(t)facts.push({label:lab, text:t});
      }
    }
    if(Array.isArray(raw.articles)){
      for(i=0;i<raw.articles.length&&articles.length<12;i++){
        a=raw.articles[i];
        if(!a||typeof a!=='object')continue;
        title=str(a.title); outlet=str(a.outlet); date=str(a.date); url=str(a.url)||null;
        if(!title&&!outlet)continue;
        articles.push({title:title, outlet:outlet, date:date, url:url});
      }
    }
    if(!name&&!summary&&!facts.length&&!why&&!articles.length)return null;
    return {name:name, summary:summary, facts:facts, why_it_matters_for_coco:why, articles:articles};
  }
  function cleanMaristCohort(raw){
    if(!raw||typeof raw!=='object')return {count:0, majors:[]};
    var majors=[], i, m, c=num(raw.count);
    if(Array.isArray(raw.majors)){
      for(i=0;i<raw.majors.length&&majors.length<16;i++){
        m=str(raw.majors[i]);
        if(m)majors.push(m);
      }
    }
    if(c==null||c<0)c=majors.length;

  function layoutCol(ci){
    var col=state.cols[ci], body=$('col-body-'+ci), cue=$('col-cue-'+ci);
    if(!body)return;
    var cards=body.querySelectorAll('.card'), i, gap=8, avail=body.clientHeight;
    for(i=0;i<cards.length;i++){cards[i].style.display='';cards[i].style.flex='none';}
    var hs=[], allH=0;
    for(i=0;i<cards.length;i++){hs.push(cards[i].offsetHeight);allH+=hs[i]+(i?gap:0);}
    if(!cards.length||allH<=avail){
      col.first=0;
      cue.textContent='';cue.style.visibility='hidden';
      return;
    }
    function fits(from){var h=0,n=0;for(var j=from;j<hs.length;j++){var add=hs[j]+(n?gap:0);if(h+add>avail&&n)break;h+=add;n++;}return n;}
    var f=state.focus&&state.focus.col===ci&&!state.chipFocus?state.focus.idx:-1;
    if(f>=0&&f<col.first)col.first=f;
    while(f>=0&&f>=col.first+fits(col.first)&&col.first<f)col.first++;
    if(col.first>Math.max(0,hs.length-1))col.first=Math.max(0,hs.length-1);
    var n=fits(col.first);
    for(i=0;i<cards.length;i++)cards[i].style.display=i>=col.first&&i<col.first+n?'':'none';
    var above=col.first, below=hs.length-col.first-n;
    cue.textContent=(above?'\u25b2 '+above+' above':'')+(above&&below?'  \u00b7  ':'')+(below?'\u25bc '+below+' more':'');
    cue.style.visibility=above||below?'visible':'hidden';
  }

  function moveCardFocus(dir){

    if(!cards.length)return;
    i=state.cardFocus|0;
    if(i<0||i>=cards.length){state.cardFocus=0;paintCardFocus();return;}
    cur=cards[i].getBoundingClientRect();
    cx=cur.left+cur.width/2; cy=cur.top+cur.height/2;
    best=-1; bestScore=1e15;
    for(j=0;j<cards.length;j++){
      if(j===i)continue;
      r=cards[j].getBoundingClientRect();
      x=r.left+r.width/2; y=r.top+r.height/2;
      dx=x-cx; dy=y-cy; ok=false;
      if(dir==='right'&&dx>10)ok=true;
      else if(dir==='left'&&dx<-10)ok=true;
      else if(dir==='down'&&dy>10)ok=true;
      else if(dir==='up'&&dy<-10)ok=true;
      if(!ok)continue;
      primary=(dir==='left'||dir==='right')?Math.abs(dx):Math.abs(dy);
      secondary=(dir==='left'||dir==='right')?Math.abs(dy):Math.abs(dx);

      trim=steps[si];
      secs=buildDetailBody(s, trim);
      $('detail').innerHTML=heroHtml(s,wxBand)+(secs.length?'<div class="d-body">'+secs.join('')+'</div>':'');
      fitLogoImgsIn($('detail'));
      if(layoutDetail())break;
    }
    setTimeout(function(){fitLogoImgsIn($('detail'));layoutDetail();paintCardFocus();}, 0);
    paintCardFocus();
    setHints();
  }
  function detailBodyOverflows(){
    var root=$('detail'), body=root?root.querySelector('.d-body'):null;
    if(!body)return false;
    return body.scrollHeight>body.clientHeight+4||body.scrollWidth>body.clientWidth+4;
  }
  function layoutDetail(){
    var root=$('detail'), body=root?root.querySelector('.d-body'):null;
    if(!root||!body)return true;
    // Floor at 18px — TV-readable. Prefer more/tighter columns over shrinking text.
    var n=body.querySelectorAll('.d-sec').length, sizes=[24,22,20,18], cols, i, c;
    cols=n<=3?[2]:n<=8?[4,3,2]:[5,4,3];
    for(c=0;c<cols.length;c++){
      body.style.columnCount=String(cols[c]);
      for(i=0;i<sizes.length;i++){
        root.style.setProperty('--line-size', sizes[i]+'px');
        root.style.setProperty('--lab-size', Math.max(16, sizes[i]-2)+'px');
        if(body.scrollHeight<=body.clientHeight+4&&body.scrollWidth<=body.clientWidth+4)return true;
      }
    }
    return false;
  }
  function fmtK(n){
    var a=Math.abs(n), sign=n<0?'-':'';
    if(a>=1000)return sign+'$'+Math.round(a/1000)+'K';
    return sign+'$'+Math.round(a).toLocaleString('en-US');
  }
  function fmtRoi(n){
    var t=Math.round(n*10)/10;
    return (t%1===0?String(t):t.toFixed(1))+'x';
  }
  function renderRoiPage(){
    var r=state.roi, i, maxCost=r.ceiling, maxRoi=1;
    for(i=0;i<r.rows.length;i++){if(r.rows[i].net>maxCost)maxCost=r.rows[i].net;if(r.rows[i].roi>maxRoi)maxRoi=r.rows[i].roi;}
    maxCost=Math.max(maxCost*1.05,r.ceiling*1.05); maxRoi=Math.max(maxRoi*1.08,1);
    var ceilPct=Math.min(100,(r.ceiling/maxCost)*100);
    var rows='';
    for(i=0;i<r.rows.length;i++){
      var x=r.rows[i], tc=ROI_TIERS[x.tier], np=Math.min(100,(x.net/maxCost)*100), rp=Math.min(100,(x.roi/maxRoi)*100);
      rows+='<div class="roi-row">'+
        '<div class="roi-school"><i class="roi-dot" style="--tc:'+tc+'"></i><span class="n">'+esc(x.school)+'</span></div>'+
        '<div class="roi-metric"><div class="roi-track'+(x.est?' est':'')+'"><span class="fill" style="width:'+np.toFixed(2)+'%"></span><span class="ceil" style="left:'+ceilPct.toFixed(2)+'%"></span></div><span class="roi-val">'+fmtK(x.net)+'</span></div>'+
        '<div class="roi-metric"><div class="roi-track"><span class="fill" style="width:'+x.odds.toFixed(2)+'%;background:rgba(111,168,220,.78)"></span></div><span class="roi-val">'+Math.round(x.odds)+'%</span></div>'+
        '<div class="roi-earn">'+fmtK(x.earn)+(x.proxy?'<i>*</i>':'')+'</div>'+
        '<div class="roi-metric roi-out"><div class="roi-track"><span class="fill" style="width:'+rp.toFixed(2)+'%"></span></div><span class="roi-val">'+fmtRoi(x.roi)+'</span></div>'+
      '</div>';
    }
    var notes='';
    for(i=0;i<r.footnotes.length;i++)notes+=(i?' \u00b7 ':'')+esc(r.footnotes[i]);
    var upd=r.updated?fmtUpdated(r.updated):'';
    $('roi').innerHTML=
      '<div class="roi-head"><div class="eyebrow">College Application Board'+(upd?' \u00b7 '+esc(upd):'')+'</div>'+
      '<h2>'+esc(r.title)+'</h2>'+(r.subtitle?'<div class="roi-sub">'+esc(r.subtitle)+'</div>':'')+'</div>'+
      '<div class="roi-table"><div class="roi-cols"><span>School</span><span>Net cost / yr (no aid)</span><span>Admit odds</span><span>Biz earnings</span><span>ROI if admitted</span></div>'+
      '<div class="roi-rows">'+rows+'</div></div>'+
      '<div class="roi-leg">'+
        '<span class="item"><i class="dot" style="--c:'+ROI_TIERS.likely+'"></i>Likely</span>'+
        '<span class="item"><i class="dot" style="--c:'+ROI_TIERS.target+'"></i>Target</span>'+
        '<span class="item"><i class="dot" style="--c:'+ROI_TIERS.reach+'"></i>Reach</span>'+
        '<span class="item"><i class="ceil-mark"></i>Ceiling '+fmtK(r.ceiling)+'/yr</span>'+
        '<span class="item"><i class="dash-mark"></i>Cost partly estimated</span>'+
      '</div>'+(notes?'<div class="roi-notes">'+notes+'</div>':'');
  }
  function syncRoiChip(){
    var chip=$('roi-chip');
    if(!chip)return;
    // ROI chip belongs on the board header only — hide on detail/ROI so it cannot float over the detail title.
    var on=!!(state.roi&&state.view==='board');
    chip.hidden=!on;
    if(!on){state.chipFocus=false;chip.classList.remove('focus');}
  }
  function showRoi(on){
    if(on&&!state.roi)return;
    if(on&&state.view==='detail')showDetail(false);
    state.view=on?'roi':'board';
    if(on){
      state.chipFocus=true;
      renderRoiPage();
      $('roi').hidden=false;$('cols').hidden=true;$('detail').hidden=true;
      if($('also'))$('also').hidden=true;
      document.querySelector('.head-r').style.visibility='hidden';
      $('title').style.display='none';
      $('roi-chip').hidden=true;
    }else{
      $('roi').hidden=true;$('roi').innerHTML='';$('cols').hidden=false;
      document.querySelector('.head-r').style.visibility='';
      $('title').style.display='';
      syncRoiChip();
      if($('also')&&state.data&&state.data.also&&state.data.also.length){
        $('also').hidden=false;$('also').innerHTML=alsoHtml(state.data.also);
      }
      state.chipFocus=true;
      layoutBoard();
      paintFocus();
    }
    setHints();
  }

  function showDetail(on){
    var s=on?focusedSchool():null;
    if(on&&!(s&&s.hasDetail))return;
    if(on){
      state.chipFocus=false;state.view='detail';state.detailPage=1;state.cardFocus=0;
      // Persist last-opened so the board NEW flag clears after return / reload.
      markSchoolOpened(s);
    }
    else{state.view='board';state.detailPage=1;state.detailPages=1;state.cardFocus=0;closeCardPopup();}
    state.detail=s?s.id:null;
    if(s)renderDetail(s);else{$('detail').innerHTML='';closeCardPopup();}
    $('detail').hidden=!s;
    $('cols').hidden=!!s;
    if($('roi'))$('roi').hidden=true;
    if($('also')){
      if(s)$('also').hidden=true;
      else if(state.data&&state.data.also&&state.data.also.length){$('also').hidden=false;$('also').innerHTML=alsoHtml(state.data.also);}
    }
    document.querySelector('.head-r').style.visibility=s?'hidden':'';
    $('title').style.display=s?'none':'';
    syncRoiChip();
    if(!s){renderBoard();paintFocus();}
    setHints();
  }

  function render(d){
    state.data=d;
    state.roi=d.roi||null;
    $('stage').hidden=false;
    $('updated').textContent=fmtUpdated(d.updated)||'\u2014';
    $('counts').innerHTML=countsHtml(d.schools);
    var also=$('also'), alsoList=d.also||[];
    if(also){
      if(alsoList.length&&state.view==='board'){also.hidden=false;also.innerHTML=alsoHtml(alsoList);}
      else{also.hidden=true;also.innerHTML='';}
    }
    var wasView=state.view, wasDetail=state.detail, keepChip=state.chipFocus;
    if(wasView==='roi'||wasView==='detail'){$('cols').hidden=false;$('detail').hidden=true;$('roi').hidden=true;$('roi').innerHTML='';}
    syncRoiChip();
    renderBoard();
    if(wasView==='roi'&&state.roi)showRoi(true);
    else if(wasView==='detail'&&wasDetail){
      var s=focusedSchool();
      showDetail(!!(s&&s.id===wasDetail));
    }else{
      state.chipFocus=!!(keepChip&&state.roi);
      paintFocus();
    }
  }
  function blank(){
    state={cols:[],focus:null,detail:null,detailPage:1,detailPages:1,data:null,roi:null,chipFocus:false,view:'board',
      cardFocus:0,popupOpen:false};
    closeCardPopup();
    $('stage').hidden=true;
    $('cols').innerHTML='';$('detail').innerHTML='';$('detail').hidden=true;$('cols').hidden=false;
    if($('roi')){$('roi').innerHTML='';$('roi').hidden=true;}
    if($('also')){$('also').innerHTML='';$('also').hidden=true;}
    if($('roi-chip')){$('roi-chip').hidden=true;$('roi-chip').classList.remove('focus');}
    $('counts').innerHTML='';$('updated').textContent='';$('hints').innerHTML='';
    document.querySelector('.head-r').style.visibility='';$('title').style.display='';
  }
  function load(){
    fetch(dataFile()+'?t='+Date.now(),{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(raw){var d=clean(raw);if(!d)throw new Error('schema');render(d);})
      .catch(function(){blank();});
  }

  function move(dir){
    if(state.chipFocus){
      if(dir==='down'||dir==='left'||dir==='right'){
        state.chipFocus=false;
        if(!state.focus){
          for(var i=0;i<state.cols.length;i++)if(state.cols[i].items.length){state.focus={col:i,idx:0};break;}
        }
        if(state.focus)layoutCol(state.focus.col);
        paintFocus();
      }
      return;
    }
    var f=state.focus;
    if(!f)return;
    if(dir==='up'||dir==='down'){
      var n=state.cols[f.col].items.length, to=f.idx+(dir==='down'?1:-1);
      if(to<0){
        if(state.roi){state.chipFocus=true;paintFocus();}
        return;
      }
      if(to>=n)return;
      f.idx=to;layoutCol(f.col);
    }else{
      var step=dir==='right'?1:-1, ci=f.col+step;
      while(ci>=0&&ci<state.cols.length&&!state.cols[ci].items.length)ci+=step;
      if(ci<0||ci>=state.cols.length)return;
      var row=f.idx-state.cols[f.col].first, dest=state.cols[ci];
      state.focus={col:ci,idx:Math.min(dest.items.length-1,dest.first+Math.max(0,row))};
      layoutCol(ci);
    }
    paintFocus();
  }

  document.addEventListener('keydown',function(e){
    if(!state.data)return;
    var code=e.keyCode||e.which;
    var isBack=code===10009||code===27||code===8||e.key==='Escape'||e.key==='Backspace'||e.key==='XF86Back'||e.key==='GoBack';
    var dir;
    // Detail popup: Left/Right switch cards; Up/Down scroll; Back / Esc / Enter closes.
    if(state.view==='detail'&&state.popupOpen){
      e.preventDefault();
      if(isBack||code===13||e.key==='Enter'){closeCardPopup();return;}
      if(code===37){shiftPopupCard('left');return;}
      if(code===39){shiftPopupCard('right');return;}
      if(code===38){scrollPopup('up');return;}
      if(code===40){scrollPopup('down');return;}
      return;
    }
    if(isBack){
      e.preventDefault();
      if(state.view==='roi'){showRoi(false);return;}
      if(state.view==='detail'||state.detail){showDetail(false);return;}
      location.href=backUrl();return;
    }
    if(state.view==='roi')return;
    if(state.view==='detail'){
      if(code===13||e.key==='Enter'){e.preventDefault();openFocusedCardPopup();return;}
      dir=code===37?'left':code===39?'right':code===38?'up':code===40?'down':'';
      if(dir){e.preventDefault();moveCardFocus(dir);}
      return;
    }
    if(code===13||e.key==='Enter'){
      e.preventDefault();
      if(state.chipFocus)showRoi(true);
      else showDetail(true);
      return;
    }
    dir=code===37?'left':code===39?'right':code===38?'up':code===40?'down':'';
    if(dir){e.preventDefault();move(dir);}
  });
  document.addEventListener('click',function(e){
    var chip, el, card, pop, cards, i, nav;
    // Popup open: edge arrows switch cards; any other click on the overlay closes it.
    if(state.popupOpen){
      pop=$('d-pop');
      nav=e.target.closest?e.target.closest('[data-pop-nav]'):null;
      if(nav&&pop&&pop.contains(nav)){
        e.preventDefault();
        e.stopPropagation();
        shiftPopupCard(nav.getAttribute('data-pop-nav')==='left'?'left':'right');
        return;
      }
      if(pop&&pop.contains(e.target)){e.preventDefault();closeCardPopup();return;}
    }
    chip=e.target.closest?e.target.closest('#roi-chip'):null;
    if(chip&&state.roi&&state.view==='board'){
      e.preventDefault();state.chipFocus=true;paintFocus();showRoi(true);return;
    }
    if(state.view==='detail'){
      card=e.target.closest?e.target.closest('.d-card'):null;
      if(card&&$('detail')&&$('detail').contains(card)){
        e.preventDefault();
        cards=detailCards();
        for(i=0;i<cards.length;i++)if(cards[i]===card){state.cardFocus=i;break;}
        paintCardFocus();
        openCardPopup(card);
        return;
      }
    }
    el=e.target.closest?e.target.closest('.card'):null;
    if(!el||state.view!=='board')return;
    state.chipFocus=false;
    state.focus={col:+el.getAttribute('data-c'),idx:+el.getAttribute('data-i')};
    paintFocus();showDetail(true);
  });
  window.addEventListener('resize',fit);
  fit();
  load();
  setInterval(load,REFRESH_MS);
})();
</script>
</body>
</html>
