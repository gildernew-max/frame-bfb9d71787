name: Update dashboard data

on:
  schedule:
    # Every 15 min Sun–Fri (UTC). This covers the cash session (9:30–4:05 ET, EST or EDT)
    # and the equity-futures week (Sun 6 pm – Fri 5 pm ET) for the 'expected open' note.
    # The script decides what is actually due from the ET clock, Finnhub market-status and
    # the timestamps in data.json, and commits only when something was fetched.
    - cron: '*/15 * * * 0-5'
    # Saturday: hourly is enough (headlines; weather/NFL/rates once a day after 6 a.m. ET).
    - cron: '7 * * * 6'
  workflow_dispatch:
    inputs:
      force:
        description: 'Refetch every section now (ignore schedule)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['docs/data.json']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: frame-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch whatever is due
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: node scripts/update.mjs ${{ inputs.force && '--force' || '' }} --out docs/data.json
      - name: Commit data.json (keeps last-good data between runs)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git push && break; git pull --rebase -q; done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
